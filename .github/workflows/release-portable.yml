name: Release Portable Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.target }}

      - name: Build static binary
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo zigbuild --release -p aiwork-server --target ${{ matrix.target }}

      - name: Verify static linking
        run: file target/${{ matrix.target }}/release/aiwork-server

      - name: Package portable bundle
        run: |
          mkdir -p pkg
          cp target/${{ matrix.target }}/release/aiwork-server pkg/
          chmod +x pkg/aiwork-server
          cp -r dist pkg/web-dist
          cp scripts/start.sh pkg/start.sh
          chmod +x pkg/start.sh
          {
            echo "AIWork Assistant portable package"
            echo ""
            echo "Start:        ./start.sh"
            echo "Custom port:  PORT=9090 ./start.sh"
            echo "Custom data:  DATA_DIR=/var/lib/aiwork ./start.sh"
            echo ""
            echo "Admin token:  cat data/conf/admin_token (after first start)"
          } > pkg/README.txt
          tar czf aiwork-assistant-linux-${{ matrix.arch }}.tar.gz -C pkg .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: aiwork-assistant-linux-${{ matrix.arch }}.tar.gz
          generate_release_notes: true
